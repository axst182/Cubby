services:
  cubby:
    image: ghcr.io/axst182/cubby:latest
    container_name: cubby
    ports:
      - "3001:3001"
    environment:
      TZ: Europe/Stockholm
      NTFY_URL: ${NTFY_URL:-}
      REMINDER_TIME: ${REMINDER_TIME:-19:00}
    volumes:
      - cubby-data:/data
    restart: unless-stopped

volumes:
  cubby-data:
