services:
  cubby:
    build: .
    container_name: cubby
    ports:
      - "3001:3001"
    environment:
      TZ: Europe/Stockholm
      # Valfritt: kvällspåminnelse via ntfy, t.ex. https://ntfy.sh/ditt-hemliga-namn
      NTFY_URL: ${NTFY_URL:-}
      REMINDER_TIME: ${REMINDER_TIME:-19:00}
    volumes:
      - cubby-data:/data
    restart: unless-stopped

volumes:
  cubby-data:
