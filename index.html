<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cubby</title>
<style>
  :root{
    --bg:#eef3f6; --card:#ffffff; --ink:#1d2a35; --muted:#5d6d79;
    --ok:#2f8a68; --ok-bg:#e3f2ec; --bring:#d23f3f; --bring-bg:#fdeaea; --line:#d5dfe5;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#141c22; --card:#1e2931; --ink:#eaf0f4; --muted:#9aabb7;
      --ok:#5fc79e; --ok-bg:#1f3a30; --bring:#ff7b7b; --bring-bg:#43252a; --line:#2f3d47; }
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{font-family:ui-rounded,"SF Pro Rounded",system-ui,-apple-system,"Segoe UI",sans-serif;
    background:var(--bg);color:var(--ink);line-height:1.4;
    padding:max(16px,env(safe-area-inset-top)) 16px max(24px,env(safe-area-inset-bottom))}
  main{max-width:520px;margin:0 auto}
  header{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:14px}
  h1{font-size:1.6rem;margin:0}
  .link{background:none;border:0;color:var(--muted);font:inherit;padding:8px 0;cursor:pointer}
  .summary{border-radius:18px;padding:16px 18px;margin-bottom:16px;background:var(--ok-bg);color:var(--ok);font-weight:600}
  .summary.has{background:var(--bring-bg);color:var(--bring)}
  .summary strong{display:block;font-size:1.15rem;margin-bottom:4px}
  .summary ul{margin:6px 0 12px;padding-left:20px;color:var(--ink);font-weight:500}
  .summary button{font:inherit;font-weight:600;border:2px solid var(--bring);color:var(--bring);
    background:transparent;border-radius:12px;padding:10px 14px;cursor:pointer;width:100%}
  ul.list{list-style:none;margin:0;padding:0;display:grid;gap:8px}
  .row{display:flex;align-items:center;gap:8px}
  .item{flex:1;display:flex;align-items:center;gap:14px;width:100%;text-align:left;
    background:var(--card);border:2px solid var(--line);border-radius:16px;padding:14px 16px;
    font:inherit;color:inherit;cursor:pointer;min-height:60px}
  .box{flex:none;width:28px;height:28px;border-radius:9px;border:2.5px solid var(--ok);
    display:grid;place-items:center;color:#fff;font-weight:700}
  .item[aria-pressed=true]{border-color:var(--bring);background:var(--bring-bg)}
  .item[aria-pressed=true] .box{background:var(--bring);border-color:var(--bring)}
  .item[aria-pressed=true] .box::after{content:"✓"}
  .name{flex:1;font-size:1.05rem;font-weight:600}
  .state{font-size:.85rem;color:var(--muted)}
  .item[aria-pressed=true] .state{color:var(--bring);font-weight:600}
  .del{flex:none;width:48px;height:48px;border-radius:14px;border:2px solid var(--line);
    background:var(--card);color:var(--bring);font-size:1.2rem;cursor:pointer}
  form{display:flex;gap:8px;margin-top:16px}
  input{flex:1;font:inherit;padding:14px 16px;border-radius:14px;border:2px solid var(--line);
    background:var(--card);color:var(--ink);min-width:0}
  form button{font:inherit;font-weight:600;border:0;border-radius:14px;padding:0 18px;
    background:var(--ink);color:var(--bg);cursor:pointer}
  .step{flex:none;display:flex;align-items:center;gap:2px;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:2px}
  .step button{width:36px;height:44px;border:0;background:none;color:var(--ink);font-size:1.3rem;cursor:pointer;border-radius:10px}
  .step button:disabled{opacity:.3;cursor:default}
  .step span{min-width:22px;text-align:center;font-weight:700}
  .count{color:var(--muted);font-weight:600;margin-left:4px}
  #qty{flex:none;width:72px}
  .seasons{display:flex;gap:6px;background:var(--card);border:2px solid var(--line);border-radius:16px;padding:4px;margin-bottom:12px}
  .seg{flex:1;font:inherit;font-weight:600;border:0;border-radius:12px;padding:10px 6px;background:none;color:var(--muted);cursor:pointer}
  .seg[aria-pressed=true]{background:var(--ink);color:var(--bg)}
  .note{display:block;font-size:.85rem;font-weight:400;color:var(--muted)}
  .row.editing{flex-wrap:wrap}
  .row.editing .item{width:auto;flex:1 1 180px}
  .extra{flex-basis:100%;display:grid;gap:8px;padding:0 4px 10px}
  .noteinput{padding:10px 12px;border-radius:12px;font-size:.95rem}
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chip{font:inherit;font-size:.85rem;font-weight:600;border:2px solid var(--line);background:var(--card);color:var(--muted);border-radius:999px;padding:6px 12px;cursor:pointer}
  .chip[aria-pressed=true]{border-color:var(--ok);background:var(--ok-bg);color:var(--ok)}
  button:focus-visible,input:focus-visible{outline:3px solid var(--ok);outline-offset:2px}
  .hint{color:var(--muted);font-size:.9rem;margin:0 0 10px}
</style>
</head>
<body>
<main>
  <header>
    <h1>Cubby</h1>
    <button class="link" id="edit">Redigera</button>
  </header>
  <section class="summary" id="summary" aria-live="polite"></section>
  <div class="seasons" id="seasons" role="group" aria-label="Säsong"></div>
  <p class="hint">Bocka i det du tog hem och behöver ta med nästa dag. Ändra antal, anteckning och säsong under Redigera.</p>
  <ul class="list" id="list"></ul>
  <form id="add" hidden>
    <input id="qty" type="number" min="1" max="20" value="1" inputmode="numeric" aria-label="Antal">
    <input id="name" placeholder="Nytt plagg, t.ex. Fleecetröja" maxlength="60" aria-label="Nytt plagg">
    <button>Lägg till</button>
  </form>
</main>
<script>
let items = [], season = 'vinter', editing = false;
const SEASONS = [['vinter', 'Vinter'], ['var-host', 'Vår/höst'], ['sommar', 'Sommar']];
const $ = (id) => document.getElementById(id);
const esc = (t) => t.replace(/[&<>"]/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const label = (i) => esc(i.name) + (i.qty > 1 ? ' ×' + i.bringQty : '');

let pending = 0;
// Visar ändringen direkt (apply) och skickar den till servern i bakgrunden.
// Misslyckas anropet hämtas serverns version igen, så vyn aldrig visar fel status.
async function api(method, url, body, apply) {
  if (apply) { apply(); render(); }
  pending++;
  let ok = true;
  try {
    const r = await fetch(url, { method, headers: {'Content-Type':'application/json'}, body: body ? JSON.stringify(body) : undefined });
    if (!r.ok) throw new Error('Något gick fel');
    const d = await r.json();
    if (pending === 1) ({ season, items } = d); // ta emot serverns version först när inget annat väntar
  } catch { ok = false; }
  pending--;
  if (ok) render(); else await refresh();
}

function stepper(val, min, max, name, onChange) {
  const d = document.createElement('div');
  d.className = 'step';
  d.innerHTML = '<button type="button" aria-label="Minska antal ' + esc(name) + '">−</button><span>' + val +
    '</span><button type="button" aria-label="Öka antal ' + esc(name) + '">+</button>';
  const [minus, plus] = d.querySelectorAll('button');
  minus.disabled = val <= min; plus.disabled = val >= max;
  minus.onclick = () => onChange(val - 1);
  plus.onclick = () => onChange(val + 1);
  return d;
}

function extras(i) {
  const d = document.createElement('div');
  d.className = 'extra';
  d.innerHTML = '<input class="noteinput" maxlength="100" placeholder="Anteckning, t.ex. stl 98 eller märkt med namn" aria-label="Anteckning för ' + esc(i.name) + '" value="' + esc(i.note) + '">' +
    '<span class="chips"><button type="button" class="chip" data-k="" aria-pressed="' + !i.seasons.length + '">Året runt</button>' +
    SEASONS.map(([k, n]) => '<button type="button" class="chip" data-k="' + k + '" aria-pressed="' + i.seasons.includes(k) + '">' + n + '</button>').join('') + '</span>';
  d.querySelector('input').onchange = (e) => api('PATCH', '/api/items/' + i.id, { note: e.target.value }, () => { i.note = e.target.value; });
  d.querySelectorAll('.chip').forEach((b) => b.onclick = () => {
    const k = b.dataset.k;
    const next = !k ? [] : i.seasons.includes(k) ? i.seasons.filter((x) => x !== k) : [...i.seasons, k];
    api('PATCH', '/api/items/' + i.id, { seasons: next }, () => { i.seasons = next; });
  });
  return d;
}

function render() {
  const bring = items.filter((i) => i.bring);
  const s = $('summary');
  s.className = 'summary' + (bring.length ? ' has' : '');
  if (bring.length) {
    s.innerHTML = '<strong>Ta med nästa dag</strong><ul>' +
      bring.map((i) => '<li>' + label(i) + '</li>').join('') +
      '</ul><button id="done">Jag har lämnat allt</button>';
    $('done').onclick = () => api('POST', '/api/reset', null, () => items.forEach((x) => { x.bring = false; x.bringQty = x.qty; }));
  } else {
    s.innerHTML = '<strong>Allt finns på förskolan</strong>Inget behöver tas med.';
  }
  $('seasons').innerHTML = SEASONS.map(([k, n]) => '<button type="button" class="seg" data-k="' + k + '" aria-pressed="' + (k === season) + '">' + n + '</button>').join('');
  $('seasons').querySelectorAll('.seg').forEach((b) => b.onclick = () => api('PUT', '/api/season', { season: b.dataset.k }, () => { season = b.dataset.k; }));
  $('list').innerHTML = '';
  const visible = editing ? items : items.filter((i) => !i.seasons.length || i.seasons.includes(season));
  visible.forEach((i) => {
    const li = document.createElement('li');
    li.className = 'row' + (editing ? ' editing' : '');
    li.innerHTML = '<button class="item" aria-pressed="' + i.bring + '"><span class="box"></span>' +
      '<span class="name">' + esc(i.name) + (i.qty > 1 ? '<span class="count">×' + i.qty + '</span>' : '') +
      (i.note ? '<small class="note">' + esc(i.note) + '</small>' : '') + '</span>' +
      '<span class="state">' + (i.bring ? 'Ta med' : 'På förskolan') + '</span></button>';
    li.querySelector('.item').onclick = () => api('PATCH', '/api/items/' + i.id, { bring: !i.bring }, () => { i.bring = !i.bring; if (i.bring) i.bringQty = i.qty; });
    if (!editing && i.bring && i.qty > 1) {
      li.appendChild(stepper(i.bringQty, 1, i.qty, i.name, (v) => api('PATCH', '/api/items/' + i.id, { bringQty: v }, () => { i.bringQty = v; })));
    }
    if (editing) {
      li.appendChild(stepper(i.qty, 1, 20, i.name, (v) => api('PATCH', '/api/items/' + i.id, { qty: v }, () => { i.qty = v; i.bringQty = Math.min(i.bringQty, v); })));
      const d = document.createElement('button');
      d.className = 'del'; d.textContent = '✕'; d.setAttribute('aria-label', 'Ta bort ' + i.name);
      d.onclick = () => confirm('Ta bort "' + i.name + '" från listan?') && api('DELETE', '/api/items/' + i.id, null, () => { items = items.filter((x) => x.id !== i.id); });
      li.appendChild(d);
      li.appendChild(extras(i));
    }
    $('list').appendChild(li);
  });
  $('add').hidden = !editing;
  $('edit').textContent = editing ? 'Klar' : 'Redigera';
}

$('edit').onclick = () => { editing = !editing; render(); };
$('add').onsubmit = (e) => {
  e.preventDefault();
  const v = $('name').value.trim();
  if (v) { const q = $('qty').value; $('name').value = ''; $('qty').value = 1; api('POST', '/api/items', { name: v, qty: q }); }
};

const refresh = () => fetch('/api/items').then((r) => r.json()).then((d) => { ({ season, items } = d); render(); }).catch(() => {});
refresh();
// Håll flera föräldrars vyer synkade
setInterval(() => { if (!editing && !pending) refresh(); }, 15000);
</script>
</body>
</html>
